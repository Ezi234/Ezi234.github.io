  <path d="M360 216 v-22 q0 -12 14 -12 q14 0 14 12 v12" stroke="#8d9296" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="356" y="216" width="8" height="68" fill="#8d9296"/>

