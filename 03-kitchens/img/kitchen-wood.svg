    <g><line x1="86" y1="226" x2="86" y2="256"/><line x1="166" y1="226" x2="166" y2="256"/><line x1="246" y1="226" x2="246" y2="256"/><line x1="326" y1="226" x2="326" y2="256"/><line x1="406" y1="226" x2="406" y2="256"/><line x1="486" y1="226" x2="486" y2="256"/><line x1="566" y1="226" x2="566" y2="256"/></g>
    <g><line x1="46" y1="256" x2="46" y2="284"/><line x1="126" y1="256" x2="126" y2="284"/><line x1="206" y1="256" x2="206" y2="284"/><line x1="286" y1="256" x2="286" y2="284"/><line x1="366" y1="256" x2="366" y2="284"/><line x1="446" y1="256" x2="446" y2="284"/><line x1="526" y1="256" x2="526" y2="284"/><line x1="606" y1="256" x2="606" y2="284"/></g>
