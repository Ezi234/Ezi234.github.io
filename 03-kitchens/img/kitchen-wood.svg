  <line x1="125" y1="66" x2="125" y2="192" stroke="#7d5630" stroke-width="3"/>
  <rect x="96" y="120" width="8" height="34" rx="4" fill="#33383b"/>
  <rect x="146" y="120" width="8" height="34" rx="4" fill="#33383b"/>

