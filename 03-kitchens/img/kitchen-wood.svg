  <g fill="#33383b">
    <rect x="34" y="318" width="40" height="7" rx="3.5"/><rect x="136" y="318" width="40" height="7" rx="3.5"/>
    <rect x="34" y="380" width="40" height="7" rx="3.5"/><rect x="136" y="380" width="40" height="7" rx="3.5"/>
