<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Кухня с островом и барной стойкой">
  <defs>
    <linearGradient id="wIs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3f2"/><stop offset="1" stop-color="#e0e5e3"/>
    </linearGradient>
    <linearGradient id="cIs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a45"/><stop offset="1" stop-color="#6d5133"/>
    </linearGradient>
    <linearGradient id="fIs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7c2b8"/><stop offset="1" stop-color="#a8a298"/>
    </linearGradient>
    <clipPath id="kIs"><rect width="640" height="480"/></clipPath>
  </defs>

  <g clip-path="url(#kIs)">
    <rect width="640" height="480" fill="url(#wIs)"/>
    <rect width="640" height="34" fill="#f8faf9"/>

    <!-- окно во всю стену слева -->
    <rect x="26" y="66" width="188" height="176" rx="4" fill="#dfeaef" stroke="#c2cccb" stroke-width="5"/>
    <line x1="120" y1="66" x2="120" y2="242" stroke="#c2cccb" stroke-width="5"/>
    <line x1="26" y1="154" x2="214" y2="154" stroke="#c2cccb" stroke-width="4"/>
    <path d="M34 236 l40 -54 26 32 22 -26 34 48z" fill="#cfdde2" opacity=".7"/>
    <rect x="18" y="242" width="204" height="12" rx="3" fill="#eef1f0"/>

    <!-- фартук справа -->
    <rect x="252" y="176" width="388" height="96" fill="#e8ece9"/>
    <g stroke="#d3dad6" stroke-width="2">
      <line x1="252" y1="208" x2="640" y2="208"/><line x1="252" y1="240" x2="640" y2="240"/>
      <line x1="316" y1="176" x2="316" y2="272"/><line x1="380" y1="176" x2="380" y2="272"/>
      <line x1="444" y1="176" x2="444" y2="272"/><line x1="508" y1="176" x2="508" y2="272"/>
      <line x1="572" y1="176" x2="572" y2="272"/>
    </g>

    <!-- верхние шкафы до потолка -->
    <rect x="252" y="46" width="388" height="130" rx="5" fill="url(#cIs)"/>
    <g stroke="#5b431f" stroke-width="3">
      <line x1="349" y1="46" x2="349" y2="176"/><line x1="446" y1="46" x2="446" y2="176"/>
      <line x1="543" y1="46" x2="543" y2="176"/>
    </g>
    <g fill="#e6e1d6">
      <rect x="288" y="150" width="26" height="6" rx="3"/><rect x="385" y="150" width="26" height="6" rx="3"/>
      <rect x="482" y="150" width="26" height="6" rx="3"/><rect x="579" y="150" width="26" height="6" rx="3"/>
    </g>
    <path d="M252 176 h388 l-14 26 h-360z" fill="#f7edc9" opacity=".5"/>

    <!-- столешница и нижние шкафы у стены -->
    <rect x="240" y="272" width="400" height="18" rx="3" fill="#eeece6"/>
    <rect x="240" y="290" width="400" height="112" fill="url(#cIs)"/>
    <g stroke="#5b431f" stroke-width="3">
      <line x1="340" y1="290" x2="340" y2="402"/><line x1="440" y1="290" x2="440" y2="402"/>
      <line x1="540" y1="290" x2="540" y2="402"/>
      <line x1="440" y1="336" x2="640" y2="336"/>
    </g>
    <g fill="#e6e1d6">
      <rect x="276" y="306" width="30" height="6" rx="3"/><rect x="376" y="306" width="30" height="6" rx="3"/>
      <rect x="476" y="306" width="30" height="6" rx="3"/><rect x="576" y="306" width="30" height="6" rx="3"/>
      <rect x="476" y="362" width="30" height="6" rx="3"/><rect x="576" y="362" width="30" height="6" rx="3"/>
    </g>
    <!-- мойка -->
    <rect x="266" y="276" width="66" height="10" rx="4" fill="#c9c4b8"/>
    <path d="M298 210 v-18 q0 -10 12 -10 q12 0 12 10 v10" stroke="#8d9296" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="294" y="206" width="8" height="66" fill="#8d9296"/>

    <!-- остров с барной стойкой -->
    <g>
      <rect x="96" y="322" width="330" height="16" rx="4" fill="#eeece6"/>
      <rect x="118" y="338" width="286" height="90" fill="#2f3a3f"/>
      <g stroke="#212a2e" stroke-width="3">
        <line x1="190" y1="338" x2="190" y2="428"/><line x1="262" y1="338" x2="262" y2="428"/>
        <line x1="334" y1="338" x2="334" y2="428"/>
      </g>
      <g fill="#c9a95f">
        <rect x="142" y="356" width="26" height="6" rx="3"/><rect x="214" y="356" width="26" height="6" rx="3"/>
        <rect x="286" y="356" width="26" height="6" rx="3"/><rect x="358" y="356" width="26" height="6" rx="3"/>
      </g>
      <!-- варочная панель на острове -->
      <rect x="196" y="312" width="112" height="12" rx="3" fill="#20272a"/>
      <g fill="#4c585e"><circle cx="220" cy="318" r="5"/><circle cx="252" cy="318" r="5"/><circle cx="284" cy="318" r="5"/></g>
    </g>

    <!-- барные стулья -->
    <g>
      <rect x="150" y="428" width="52" height="8" rx="4" fill="#8d9296"/>
      <rect x="170" y="436" width="12" height="34" fill="#8d9296"/>
      <rect x="144" y="404" width="64" height="14" rx="6" fill="#8a6a45"/>
      <rect x="284" y="428" width="52" height="8" rx="4" fill="#8d9296"/>
      <rect x="304" y="436" width="12" height="34" fill="#8d9296"/>
      <rect x="278" y="404" width="64" height="14" rx="6" fill="#8a6a45"/>
    </g>

    <!-- подвесные светильники над островом -->
    <g>
      <line x1="180" y1="34" x2="180" y2="150" stroke="#20272a" stroke-width="3"/>
      <path d="M156 186 l24 -36 24 36z" fill="#20272a"/>
      <ellipse cx="180" cy="188" rx="24" ry="6" fill="#f7dd9a"/>
      <circle cx="180" cy="196" r="30" fill="#f7dd9a" opacity=".22"/>
      <line x1="300" y1="34" x2="300" y2="150" stroke="#20272a" stroke-width="3"/>
      <path d="M276 186 l24 -36 24 36z" fill="#20272a"/>
      <ellipse cx="300" cy="188" rx="24" ry="6" fill="#f7dd9a"/>
      <circle cx="300" cy="196" r="30" fill="#f7dd9a" opacity=".22"/>
    </g>

    <!-- пол -->
    <rect y="440" width="640" height="40" fill="url(#fIs)"/>
    <g stroke="#948e84" stroke-width="1.6" opacity=".6">
      <line x1="0" y1="462" x2="640" y2="462"/>
      <line x1="140" y1="440" x2="130" y2="480"/><line x1="320" y1="440" x2="310" y2="480"/>
      <line x1="500" y1="440" x2="490" y2="480"/>
    </g>
    <rect y="434" width="640" height="8" fill="#2f3a3f"/>

    <!-- мелочи -->
    <rect x="482" y="242" width="26" height="30" rx="4" fill="#157a5b"/>
    <rect x="488" y="234" width="14" height="10" rx="3" fill="#b98b4a"/>
    <ellipse cx="546" cy="262" rx="24" ry="7" fill="#e6e1d6"/>
    <path d="M524 262 q22 -20 44 0" fill="#f2eee4"/>
    <rect x="356" y="292" width="30" height="30" rx="4" fill="#b98b4a" opacity=".9"/>
  </g>
</svg>
