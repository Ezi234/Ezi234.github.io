<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Дом зимой со снегом на кровле">
  <defs>
    <linearGradient id="skyWn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1626"/><stop offset="0.55" stop-color="#1d2f47"/><stop offset="1" stop-color="#3d5771"/>
    </linearGradient>
    <linearGradient id="wallWn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6444"/><stop offset="1" stop-color="#634631"/>
    </linearGradient>
    <radialGradient id="glowWn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7d" stop-opacity="0.5"/><stop offset="1" stop-color="#ffcf7d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cutWn"><rect width="640" height="440"/></clipPath>
  </defs>

  <g clip-path="url(#cutWn)">
    <rect width="640" height="440" fill="url(#skyWn)"/>

    <!-- снежинки -->
    <g fill="#ffffff">
      <circle cx="60" cy="52" r="2" opacity=".7"/><circle cx="146" cy="94" r="1.6" opacity=".5"/>
      <circle cx="224" cy="38" r="2.2" opacity=".65"/><circle cx="318" cy="112" r="1.7" opacity=".45"/>
      <circle cx="402" cy="56" r="2" opacity=".6"/><circle cx="498" cy="102" r="1.6" opacity=".5"/>
      <circle cx="574" cy="44" r="2.1" opacity=".6"/><circle cx="106" cy="150" r="1.5" opacity=".4"/>
      <circle cx="360" cy="176" r="1.4" opacity=".35"/><circle cx="530" cy="164" r="1.6" opacity=".4"/>
      <circle cx="250" cy="200" r="1.3" opacity=".3"/><circle cx="440" cy="210" r="1.5" opacity=".35"/>
    </g>
    <circle cx="548" cy="72" r="24" fill="#eef4fb" opacity=".85"/>
    <circle cx="540" cy="66" r="24" fill="#1d2f47"/>

    <!-- заснеженный лес -->
    <g>
      <path d="M0 300 l30 -66 30 66z" fill="#132234"/><path d="M0 300 l30 -66 12 26 18 -8 -18 -18z" fill="#e8eff7" opacity=".55"/>
      <path d="M52 300 l24 -50 24 50z" fill="#132234"/><path d="M52 300 l24 -50 10 20 14 -6 -14 -14z" fill="#e8eff7" opacity=".5"/>
      <path d="M556 300 l28 -58 28 58z" fill="#132234"/><path d="M556 300 l28 -58 12 24 16 -8 -16 -16z" fill="#e8eff7" opacity=".5"/>
    </g>

    <!-- снежная земля -->
    <rect y="300" width="640" height="140" fill="#dde7f0"/>
    <path d="M0 300 q160 -18 320 4 t320 -10 v146 H0z" fill="#eaf1f7"/>
    <path d="M0 356 q180 12 340 -6 t300 10 v80 H0z" fill="#f4f8fb"/>
    <ellipse cx="300" cy="352" rx="190" ry="42" fill="url(#glowWn)"/>

    <!-- корпус -->
    <rect x="158" y="196" width="264" height="104" fill="url(#wallWn)"/>
    <g stroke="#4e3724" stroke-width="1.6" opacity=".7">
      <line x1="158" y1="214" x2="422" y2="214"/><line x1="158" y1="234" x2="422" y2="234"/>
      <line x1="158" y1="254" x2="422" y2="254"/><line x1="158" y1="274" x2="422" y2="274"/>
    </g>
    <rect x="152" y="294" width="276" height="10" fill="#2a2f36"/>

    <!-- кровля со снегом -->
    <path d="M142 200 L290 104 L438 200 L420 200 L290 116 L160 200z" fill="#3d4650"/>
    <path d="M290 104 L438 200 L420 200 L290 116z" fill="#2b323a"/>
    <!-- снежная шапка -->
    <path d="M142 200 L290 104 L438 200 L414 200 q-40 -18 -62 -44 q-30 -34 -62 -34 q-32 0 -62 34 q-22 26 -62 44z" fill="#f2f7fb"/>
    <path d="M142 200 q26 8 44 4 q22 12 44 2 q24 10 46 2 q24 10 46 0 q22 10 44 -2 q22 8 46 -6 l-8 4 q-40 12 -84 6 q-46 8 -92 0 q-46 8 -86 -10z" fill="#dfe9f2"/>

    <!-- фронтон -->
    <path d="M182 198 L290 128 L398 198z" fill="#9a7050"/>
    <!-- мансардное окно -->
    <rect x="264" y="152" width="50" height="36" rx="3" fill="#ffce7a"/>
    <rect x="260" y="148" width="58" height="44" rx="4" fill="none" stroke="#eef1f5" stroke-width="4"/>
    <line x1="289" y1="152" x2="289" y2="188" stroke="#eef1f5" stroke-width="3"/>
    <circle cx="289" cy="170" r="44" fill="url(#glowWn)"/>

    <!-- труба с дымом -->
    <rect x="346" y="120" width="26" height="46" fill="#2f353d"/>
    <rect x="341" y="114" width="36" height="10" rx="2" fill="#454e58"/>
    <rect x="341" y="110" width="36" height="6" rx="3" fill="#f2f7fb"/>
    <g fill="#cbd8e4" opacity=".5">
      <circle cx="360" cy="96" r="9"/><circle cx="370" cy="76" r="12"/><circle cx="358" cy="54" r="15"/>
    </g>

    <!-- окна -->
    <g>
      <rect x="186" y="222" width="46" height="46" fill="#ffce7a"/>
      <rect x="182" y="218" width="54" height="54" fill="none" stroke="#eef1f5" stroke-width="4"/>
      <line x1="209" y1="222" x2="209" y2="268" stroke="#eef1f5" stroke-width="3"/>
      <rect x="180" y="214" width="58" height="6" rx="3" fill="#f2f7fb"/>
      <circle cx="209" cy="245" r="46" fill="url(#glowWn)"/>

      <rect x="348" y="222" width="46" height="46" fill="#ffce7a"/>
      <rect x="344" y="218" width="54" height="54" fill="none" stroke="#eef1f5" stroke-width="4"/>
      <line x1="371" y1="222" x2="371" y2="268" stroke="#eef1f5" stroke-width="3"/>
      <rect x="342" y="214" width="58" height="6" rx="3" fill="#f2f7fb"/>
      <circle cx="371" cy="245" r="46" fill="url(#glowWn)"/>
    </g>

    <!-- дверь и крыльцо -->
    <rect x="270" y="228" width="40" height="66" rx="2" fill="#4e3724"/>
    <rect x="266" y="224" width="48" height="70" rx="3" fill="none" stroke="#eef1f5" stroke-width="4"/>
    <circle cx="304" cy="260" r="3" fill="#e0a458"/>
    <rect x="256" y="294" width="68" height="8" fill="#e9f0f6"/>
    <rect x="248" y="302" width="84" height="8" fill="#dbe5ee"/>

    <!-- ёлка у крыльца с гирляндой -->
    <g>
      <rect x="486" y="284" width="7" height="18" fill="#33261a"/>
      <path d="M489.5 190 l30 46 -60 0z" fill="#16301f"/>
      <path d="M489.5 218 l34 50 -68 0z" fill="#1c3c28"/>
      <path d="M489.5 248 l36 44 -72 0z" fill="#16301f"/>
      <path d="M489.5 190 l30 46 -12 -2 -18 -30z" fill="#eaf1f7" opacity=".5"/>
      <g fill="#ffce7a">
        <circle cx="474" cy="228" r="3"/><circle cx="502" cy="222" r="3"/>
        <circle cx="466" cy="258" r="3"/><circle cx="512" cy="256" r="3"/>
        <circle cx="486" cy="276" r="3"/>
      </g>
    </g>

    <!-- сугробы -->
    <ellipse cx="120" cy="318" rx="60" ry="14" fill="#f4f8fb"/>
    <ellipse cx="560" cy="326" rx="70" ry="16" fill="#f4f8fb"/>

    <!-- дорожка в снегу -->
    <path d="M268 310 h44 l34 130 -112 0z" fill="#cfdbe6"/>
  </g>
</svg>
