<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Гостиная после ремонта">
  <defs>
    <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#e8e0d3"/>
    </linearGradient>
    <linearGradient id="floorA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c1965f"/>
      <stop offset="1" stop-color="#a97c48"/>
    </linearGradient>
    <linearGradient id="lightA" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff8e6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff8e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e8f0"/>
      <stop offset="1" stop-color="#f2f7fa"/>
    </linearGradient>
    <clipPath id="frameA"><rect width="640" height="480" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frameA)">
    <!-- стена и потолок -->
    <rect width="640" height="480" fill="url(#wallA)"/>
    <rect width="640" height="46" fill="#faf6ee"/>
    <line x1="0" y1="46" x2="640" y2="46" stroke="#ddd2c0" stroke-width="2"/>

    <!-- окно -->
    <g>
      <rect x="392" y="92" width="196" height="222" rx="4" fill="#efe7da" stroke="#cfc3ae" stroke-width="3"/>
      <rect x="404" y="104" width="172" height="198" fill="url(#glassA)"/>
      <line x1="490" y1="104" x2="490" y2="302" stroke="#cfc3ae" stroke-width="6"/>
      <line x1="404" y1="188" x2="576" y2="188" stroke="#cfc3ae" stroke-width="5"/>
      <!-- свет из окна -->
      <path d="M404 302 L576 302 L640 480 L330 480 Z" fill="url(#lightA)" opacity="0.55"/>
      <!-- подоконник -->
      <rect x="382" y="314" width="216" height="12" rx="3" fill="#efe9dd" stroke="#d5c9b4" stroke-width="1.5"/>
    </g>

    <!-- картины -->
    <rect x="96" y="96" width="104" height="132" rx="3" fill="#f7f2e8" stroke="#c1553a" stroke-width="3"/>
    <path d="M112 200 l26 -40 22 28 18 -22 14 34 z" fill="#e3c9a3"/>
    <circle cx="128" cy="130" r="12" fill="#c1553a" opacity="0.7"/>
    <rect x="216" y="128" width="72" height="72" rx="3" fill="#f7f2e8" stroke="#3f3b33" stroke-width="3"/>
    <path d="M228 186 l18 -26 14 18 12 -14 v22 z" fill="#b9c9b4"/>

    <!-- подвесной светильник -->
    <line x1="320" y1="46" x2="320" y2="86" stroke="#3f3b33" stroke-width="3"/>
    <path d="M292 118 l28 -34 28 34 z" fill="#3f3b33"/>
    <ellipse cx="320" cy="120" rx="28" ry="6" fill="#f5d98f"/>
    <circle cx="320" cy="126" r="26" fill="#f7dd9a" opacity="0.35"/>

    <!-- пол -->
    <rect y="392" width="640" height="88" fill="url(#floorA)"/>
    <g stroke="#8f6636" stroke-width="1.4" opacity="0.5">
      <line x1="0" y1="392" x2="640" y2="392"/>
      <line x1="0" y1="418" x2="640" y2="418"/>
      <line x1="0" y1="446" x2="640" y2="446"/>
      <line x1="70" y1="392" x2="46" y2="480"/>
      <line x1="190" y1="392" x2="166" y2="480"/>
      <line x1="330" y1="392" x2="306" y2="480"/>
      <line x1="470" y1="392" x2="446" y2="480"/>
      <line x1="600" y1="392" x2="576" y2="480"/>
    </g>
    <rect y="382" width="640" height="12" fill="#f2ece0" stroke="#d8ccb7" stroke-width="1.5"/>

    <!-- ковёр -->
    <ellipse cx="288" cy="440" rx="196" ry="36" fill="#dcd0bd" opacity="0.85"/>
    <ellipse cx="288" cy="440" rx="150" ry="26" fill="none" stroke="#c1553a" stroke-width="2.5" opacity="0.55"/>

    <!-- диван -->
    <g>
      <rect x="132" y="286" width="252" height="66" rx="12" fill="#7f8f7c"/>
      <rect x="140" y="330" width="236" height="52" rx="12" fill="#93a38f"/>
      <rect x="156" y="300" width="100" height="42" rx="9" fill="#8b9b87"/>
      <rect x="262" y="300" width="100" height="42" rx="9" fill="#8b9b87"/>
      <rect x="120" y="316" width="26" height="66" rx="10" fill="#77876f"/>
      <rect x="370" y="316" width="26" height="66" rx="10" fill="#77876f"/>
      <rect x="152" y="382" width="12" height="16" rx="3" fill="#5c4630"/>
      <rect x="352" y="382" width="12" height="16" rx="3" fill="#5c4630"/>
      <!-- подушки -->
      <rect x="168" y="304" width="44" height="42" rx="8" fill="#c1553a" transform="rotate(-8 190 325)"/>
      <rect x="308" y="304" width="44" height="42" rx="8" fill="#e0b473" transform="rotate(7 330 325)"/>
    </g>

    <!-- журнальный столик -->
    <g>
      <ellipse cx="288" cy="408" rx="72" ry="16" fill="#b3823f"/>
      <ellipse cx="288" cy="404" rx="72" ry="16" fill="#c8964f"/>
      <rect x="282" y="410" width="12" height="30" rx="4" fill="#8c6432"/>
      <ellipse cx="288" cy="442" rx="30" ry="7" fill="#8c6432"/>
      <rect x="266" y="386" width="30" height="8" rx="3" fill="#f2ece0"/>
      <rect x="272" y="380" width="18" height="7" rx="3" fill="#c1553a"/>
    </g>

    <!-- растение -->
    <g>
      <path d="M540 392 q-6 -54 -30 -80" stroke="#5f7a53" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M540 392 q10 -50 40 -70" stroke="#5f7a53" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M540 392 q0 -66 4 -96" stroke="#5f7a53" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="508" cy="306" rx="24" ry="13" fill="#6f8f60" transform="rotate(-30 508 306)"/>
      <ellipse cx="582" cy="318" rx="24" ry="13" fill="#6f8f60" transform="rotate(28 582 318)"/>
      <ellipse cx="544" cy="290" rx="15" ry="26" fill="#7fa06d"/>
      <path d="M518 392 h48 l-7 46 h-34 z" fill="#c1553a"/>
      <rect x="514" y="386" width="56" height="12" rx="4" fill="#a8462f"/>
    </g>

    <!-- торшер -->
    <g>
      <line x1="82" y1="392" x2="82" y2="268" stroke="#3f3b33" stroke-width="4"/>
      <ellipse cx="82" cy="392" rx="24" ry="7" fill="#3f3b33"/>
      <path d="M56 264 h52 l-10 -40 h-32 z" fill="#efe2c4"/>
      <ellipse cx="82" cy="266" rx="26" ry="7" fill="#f7dd9a" opacity="0.5"/>
    </g>
  </g>
</svg>
