<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Та же комната до ремонта">
  <defs>
    <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdc7bd"/>
      <stop offset="1" stop-color="#b3aca1"/>
    </linearGradient>
    <linearGradient id="floorB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c968c"/>
      <stop offset="1" stop-color="#837d74"/>
    </linearGradient>
    <clipPath id="frameB"><rect width="640" height="480"/></clipPath>
  </defs>

  <g clip-path="url(#frameB)">
    <!-- голая стена -->
    <rect width="640" height="480" fill="url(#wallB)"/>
    <rect width="640" height="46" fill="#c4bdb2"/>
    <line x1="0" y1="46" x2="640" y2="46" stroke="#9d968b" stroke-width="2"/>

    <!-- пятна и отслоившаяся штукатурка -->
    <path d="M60 120 q40 -26 84 -6 q30 40 -6 66 q-58 16 -78 -22 z" fill="#bdb6ab" opacity="0.9"/>
    <path d="M200 240 q52 -18 84 10 q6 40 -40 46 q-56 2 -44 -56 z" fill="#c2bbb0" opacity="0.85"/>
    <path d="M480 96 q34 -12 52 14 q4 30 -30 34 q-38 -2 -22 -48 z" fill="#bdb6ab" opacity="0.8"/>

    <!-- трещины -->
    <g stroke="#8d867c" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M150 60 l14 54 -10 40 16 46"/>
      <path d="M164 114 l-30 26"/>
      <path d="M356 62 l-8 62 12 38"/>
      <path d="M348 124 l26 20"/>
      <path d="M600 150 l-16 70 10 44"/>
    </g>

    <!-- старое окно -->
    <g>
      <rect x="392" y="92" width="196" height="222" rx="2" fill="#a89f92" stroke="#7e7669" stroke-width="3"/>
      <rect x="404" y="104" width="172" height="198" fill="#b8c2c4"/>
      <line x1="490" y1="104" x2="490" y2="302" stroke="#8b8375" stroke-width="7"/>
      <line x1="404" y1="188" x2="576" y2="188" stroke="#8b8375" stroke-width="6"/>
      <!-- облупившаяся краска на раме -->
      <path d="M400 130 l10 -4 4 22 -12 2z" fill="#8a8275"/>
      <path d="M572 240 l10 -6 2 26 -12 2z" fill="#8a8275"/>
      <rect x="382" y="314" width="216" height="12" rx="2" fill="#a49b8e" stroke="#7e7669" stroke-width="1.5"/>
      <!-- заклеенное скотчем стекло -->
      <line x1="410" y1="112" x2="484" y2="182" stroke="#cdd3d3" stroke-width="4" opacity="0.8"/>
    </g>

    <!-- торчащие провода -->
    <g stroke="#6b6459" stroke-width="3.4" fill="none" stroke-linecap="round">
      <path d="M300 46 q6 26 -12 40 q-16 12 -6 30"/>
      <path d="M320 46 q-4 30 14 44 q14 12 4 28"/>
    </g>
    <circle cx="282" cy="116" r="5" fill="#b0533c"/>
    <circle cx="338" cy="118" r="5" fill="#4f5f7c"/>
    <rect x="286" y="42" width="52" height="12" rx="3" fill="#8d867c"/>

    <!-- отверстие под розетку -->
    <rect x="120" y="300" width="34" height="34" rx="3" fill="#7c756a"/>
    <path d="M137 300 v-40" stroke="#6b6459" stroke-width="3"/>

    <!-- пол: голая стяжка с перепадом -->
    <rect y="392" width="640" height="88" fill="url(#floorB)"/>
    <g stroke="#736d64" stroke-width="1.6" opacity="0.65" fill="none">
      <path d="M0 402 q160 -8 320 4 t320 -2"/>
      <path d="M0 434 q200 10 340 -6 t300 8"/>
      <path d="M84 392 l-12 88"/>
      <path d="M420 392 l16 88"/>
    </g>
    <rect y="384" width="640" height="10" fill="#8f8880"/>

    <!-- старая батарея -->
    <g>
      <rect x="410" y="330" width="150" height="52" rx="5" fill="#a9a094" stroke="#857d71" stroke-width="2"/>
      <g stroke="#857d71" stroke-width="3">
        <line x1="432" y1="336" x2="432" y2="376"/><line x1="454" y1="336" x2="454" y2="376"/>
        <line x1="476" y1="336" x2="476" y2="376"/><line x1="498" y1="336" x2="498" y2="376"/>
        <line x1="520" y1="336" x2="520" y2="376"/><line x1="542" y1="336" x2="542" y2="376"/>
      </g>
      <path d="M418 340 q8 -6 14 2 l-2 18 -12 -2z" fill="#966a4f" opacity="0.6"/>
    </g>

    <!-- стремянка -->
    <g stroke="#8a7250" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M96 392 L128 250"/>
      <path d="M170 392 L138 250"/>
      <path d="M112 322 h42" stroke-width="5"/>
      <path d="M104 356 h58" stroke-width="5"/>
    </g>

    <!-- мешки и мусор -->
    <path d="M224 392 q-8 -40 22 -46 q32 -2 26 46 z" fill="#8e8b84"/>
    <path d="M232 348 q14 -14 30 -2" stroke="#6f6d67" stroke-width="3" fill="none"/>
    <path d="M272 392 q-6 -28 18 -32 q26 0 20 32 z" fill="#9a978f"/>
    <g fill="#7d766c">
      <path d="M310 392 l16 -14 14 14z"/>
      <path d="M334 392 l12 -9 10 9z"/>
      <path d="M196 392 l14 -12 12 12z"/>
    </g>

    <!-- ведро -->
    <path d="M582 392 l6 -34 h34 l6 34z" fill="#7f8b93"/>
    <ellipse cx="605" cy="358" rx="17" ry="5" fill="#93a0a8"/>
    <path d="M590 356 q15 -22 30 0" stroke="#6d7880" stroke-width="3" fill="none"/>
  </g>
</svg>
