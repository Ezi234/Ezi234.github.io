    <rect x="14" y="360" width="64" height="10" rx="5" fill="#5b8cff"/>

    <rect x="180" y="200" width="164" height="180" rx="12" fill="#12141a" stroke="#242833" stroke-width="2"/>
    <rect x="194" y="214" width="136" height="92" rx="7" fill="#101a2b"/>
